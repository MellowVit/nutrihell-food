version: "3.8"

services:
  sonarqube:
    image: sonarqube:lts
    container_name: sonarqube
    restart: always
    ports:
      - "9000:9000"
    environment:
      SONARQUBE_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/sonarqube
      SONARQUBE_JDBC_USERNAME: sonar
      SONARQUBE_JDBC_PASSWORD: sonar
    networks:
      - sonarnet
    depends_on:
      - sonarqube_db
    volumes:
      - "/mnt/c/Users/lprieto/REPO_NUTRIHELL/Maven_Settings:/settings"

  sonarqube_db:
    image: postgres:latest
    container_name: sonarqube_db
    restart: always
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    networks:
      - sonarnet
    volumes:
      - sonarqube_data:/var/lib/postgresql/data

networks:
  sonarnet:

volumes:
  sonarqube_data:
